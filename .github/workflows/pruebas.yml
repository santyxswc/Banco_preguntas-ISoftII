# Compila el proyecto y corre las pruebas en cada push y pull request a main.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  monolito:
    name: Monolito (corte 1)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: banco-preguntas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar y correr las pruebas
        run: mvn -B test

  dominio-ddd:
    name: Dominio DDD puro (taller 11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saberpro-domain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar y correr las pruebas del dominio
        run: mvn -B test

  microservicios:
    name: Microservicios (corte 2)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservicios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Las pruebas no necesitan RabbitMQ: los listeners solo registran que el broker no está.
      - name: Compilar y correr las pruebas de todos los servicios
        run: mvn -B test

  frontend:
    name: Frontend web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verificar la sintaxis del JavaScript
        run: |
          node --check frontend/server.mjs
          node --check frontend/public/api.js
          node --check frontend/public/app.js
          node --check frontend/public/config.js
