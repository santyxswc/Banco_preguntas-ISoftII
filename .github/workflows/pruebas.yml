# Compila el proyecto y corre las pruebas en cada push y pull request a main.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: banco-preguntas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar y correr las pruebas
        run: mvn -B test
