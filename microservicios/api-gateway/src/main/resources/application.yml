server:
  port: ${GATEWAY_PORT:8080}

gateway:
  question-uri: ${QUESTION_SERVICE_ROUTE:http://localhost:8081}

# RNF #1: identidad. Keycloak emite los JWT; el gateway los valida y sincroniza el perfil local.
keycloak:
  # URL por la que el gateway alcanza a Keycloak (en Docker Compose: http://keycloak:8080)
  url: ${KEYCLOAK_URL:http://localhost:8180}
  realm: ${KEYCLOAK_REALM:banco-preguntas}
  # Emisor esperado en el claim "iss": la URL pública de Keycloak, igual dentro y fuera de Docker
  issuer: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/${keycloak.realm}}

identity:
  user-service-url: ${USER_SERVICE_URL:http://localhost:8083}
  cache-ttl-seconds: ${IDENTITY_CACHE_TTL_SECONDS:60}

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          # Con jwk-set-uri las llaves se descargan en la primera petición: el gateway arranca aunque Keycloak tarde
          jwk-set-uri: ${keycloak.url}/realms/${keycloak.realm}/protocol/openid-connect/certs
          issuer-uri: ${keycloak.issuer}
  cloud:
    gateway:
      default-filters:
        # Los servicios también responden CORS; se deja una sola cabecera (el navegador rechaza dos valores distintos)
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: ${FRONTEND_ORIGINS:*}
            allowedMethods: GET,POST,PUT,PATCH,DELETE,OPTIONS
            allowedHeaders: "*"
      routes:
        - id: preguntas
          uri: ${gateway.question-uri}
          predicates:
            - Path=/api/v1/preguntas,/api/v1/preguntas/**
          filters:
            - RewritePath=/api/v1/preguntas(?<segment>.*), /questions$\{segment}
        - id: usuarios
          uri: ${USER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/usuarios,/api/v1/usuarios/**
          filters:
            - RewritePath=/api/v1/usuarios(?<segment>.*), /users$\{segment}
        # Inicio y cierre de sesión: el frontend solo conoce al gateway, que reenvía a Keycloak (OpenID Connect)
        - id: autenticacion
          uri: ${keycloak.url}
          predicates:
            - Path=/api/v1/auth/token,/api/v1/auth/logout
          filters:
            - RewritePath=/api/v1/auth/(?<operation>token|logout), /realms/${keycloak.realm}/protocol/openid-connect/$\{operation}
        - id: asignaciones
          uri: ${REVIEW_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/asignaciones,/api/v1/asignaciones/**
        - id: revisiones
          uri: ${REVIEW_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/revisiones/**
        - id: ciclo-vida
          uri: ${LIFECYCLE_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/ciclo-vida/**
          filters:
            - RewritePath=/api/v1/ciclo-vida(?<segment>.*), /lifecycle$\{segment}
        - id: validaciones
          uri: ${VALIDATION_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/validaciones,/api/v1/validaciones/**
          filters:
            - RewritePath=/api/v1/validaciones(?<segment>.*), /validate$\{segment}
        - id: notificaciones
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/notificaciones,/api/v1/notificaciones/**
          filters:
            - RewritePath=/api/v1/notificaciones(?<segment>.*), /notifications$\{segment}
        # Especificaciones OpenAPI de cada microservicio, para el Swagger UI unificado del gateway
        - id: docs-preguntas
          uri: ${gateway.question-uri}
          predicates:
            - Path=/docs/preguntas/api-docs
          filters:
            - SetPath=/api-docs
        - id: docs-validaciones
          uri: ${VALIDATION_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/docs/validaciones/api-docs
          filters:
            - SetPath=/api-docs
        - id: docs-usuarios
          uri: ${USER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/docs/usuarios/api-docs
          filters:
            - SetPath=/api-docs
        - id: docs-ciclo-vida
          uri: ${LIFECYCLE_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/docs/ciclo-vida/api-docs
          filters:
            - SetPath=/api-docs
        - id: docs-revisiones
          uri: ${REVIEW_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/docs/revisiones/api-docs
          filters:
            - SetPath=/api-docs
        - id: docs-notificaciones
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/docs/notificaciones/api-docs
          filters:
            - SetPath=/api-docs

# Swagger UI unificado: http://localhost:8080/swagger-ui.html (selector de servicio arriba a la derecha)
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: "Preguntas (question-service)"
        url: /docs/preguntas/api-docs
      - name: "Revisión por pares (review-service)"
        url: /docs/revisiones/api-docs
      - name: "Ciclo de vida (lifecycle-service)"
        url: /docs/ciclo-vida/api-docs
      - name: "Validación (validation-service)"
        url: /docs/validaciones/api-docs
      - name: "Usuarios (user-service)"
        url: /docs/usuarios/api-docs
      - name: "Notificaciones (notification-service)"
        url: /docs/notificaciones/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: escalado
  cloud:
    discovery:
      client:
        simple:
          instances:
            question-service:
              - uri: ${QUESTION_SERVICE_URL:http://localhost:8081}
              - uri: ${QUESTION_SERVICE_URL_2:http://localhost:8091}

gateway:
  question-uri: lb://question-service
