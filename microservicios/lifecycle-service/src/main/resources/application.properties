spring.application.name=lifecycle-service
server.port=${LIFECYCLE_SERVICE_PORT:8084}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Base de datos propia (lifecycle_db): H2 en archivo por defecto, PostgreSQL con LIFECYCLE_DB_URL
spring.datasource.url=${LIFECYCLE_DB_URL:jdbc:h2:file:./data/lifecycle-db;AUTO_SERVER=TRUE}
spring.datasource.username=${LIFECYCLE_DB_USER:sa}
spring.datasource.password=${LIFECYCLE_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# Swagger OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.co.unicauca.iso2.taller09=INFO
