spring.application.name=notification-service
server.port=${NOTIFICATION_SERVICE_PORT:8086}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=${RABBITMQ_RETRY_MAX_ATTEMPTS:3}
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.multiplier=2.0

notifications.admin-id=${NOTIFICATIONS_ADMIN_ID:1}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.co.unicauca.iso2.taller09=INFO

# Correo electrónico (HU-04 y HU-05)
# console: correo simulado en la consola (por defecto). smtp: envío real con Spring Mail.
notifications.email.mode=${EMAIL_MODE:console}
notifications.email.from=${EMAIL_FROM:banco.preguntas@unicauca.edu.co}
services.user.url=${USER_SERVICE_URL:http://localhost:8083}
# Con EMAIL_MODE=smtp defina SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME y SPRING_MAIL_PASSWORD
# (por ejemplo Gmail: smtp.gmail.com, 587 y una contraseña de aplicación).
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
