spring.application.name=question-service
server.port=${QUESTION_SERVICE_PORT:8081}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# External Microservice URLs
services.validation.url=${VALIDATION_SERVICE_URL:http://localhost:8082}/validate
services.lifecycle.url=${LIFECYCLE_SERVICE_URL:http://localhost:8084}

# Base de datos propia (question_db): H2 en archivo por defecto, PostgreSQL con QUESTION_DB_URL
spring.datasource.url=${QUESTION_DB_URL:jdbc:h2:file:./data/question-db;AUTO_SERVER=TRUE}
spring.datasource.username=${QUESTION_DB_USER:sa}
spring.datasource.password=${QUESTION_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# Swagger OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.co.unicauca.iso2.taller09=INFO

# Preguntas de ejemplo para la demostración (desactivar en producción o en pruebas de carga)
questions.demo-data.enabled=${QUESTIONS_DEMO_DATA:true}
