spring.application.name=question-service
server.port=${QUESTION_SERVICE_PORT:8081}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# External Microservice URLs
services.validation.url=${VALIDATION_SERVICE_URL:http://localhost:8082}/validate
services.lifecycle.url=${LIFECYCLE_SERVICE_URL:http://localhost:8084}

# Swagger OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.co.unicauca.iso2.taller09=INFO
