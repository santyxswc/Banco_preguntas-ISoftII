spring.application.name=review-service
server.port=${REVIEW_SERVICE_PORT:8085}

services.lifecycle.url=${LIFECYCLE_SERVICE_URL:http://localhost:8084}
services.question.url=${QUESTION_SERVICE_URL:http://localhost:8081}
services.user.url=${USER_SERVICE_URL:http://localhost:8083}
services.http.connect-timeout-ms=${HTTP_CONNECT_TIMEOUT_MS:2000}
services.http.read-timeout-ms=${HTTP_READ_TIMEOUT_MS:3000}

spring.datasource.url=${REVIEW_DB_URL:jdbc:h2:file:./data/review-db;AUTO_SERVER=TRUE}
spring.datasource.username=${REVIEW_DB_USER:sa}
spring.datasource.password=${REVIEW_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${REVIEW_DB_DDL:update}
spring.jpa.open-in-view=false

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.co.unicauca.iso2.taller09=INFO
