spring.application.name=user-service
server.port=${USER_SERVICE_PORT:8083}

spring.datasource.url=${USER_DB_URL:jdbc:h2:file:./data/user-db;AUTO_SERVER=TRUE}
spring.datasource.username=${USER_DB_USER:sa}
spring.datasource.password=${USER_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

auth.token.secret=${AUTH_TOKEN_SECRET:banco-preguntas-secreto-desarrollo}
auth.token.ttl-minutes=${AUTH_TOKEN_TTL_MINUTES:480}

# Swagger OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.co.unicauca.iso2.taller09=INFO
